name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A warning is a failure here for the same reason it is locally: clippy runs
  # with pedantic denied, and a lint that only fails on one machine is not a lint.
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest

    # The store tests skip themselves when no server is reachable, which would
    # make them worthless here. This is what stops that skip being permanent.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v5

      # eframe links against the system windowing and input libraries even for a
      # check, so they are needed before anything compiles.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets

      - name: Tests
        run: cargo nextest run

      # A skip here would look identical to a pass, so the run is checked for
      # the line the store tests print when they find no server.
      - name: Prove the store tests were not skipped
        run: |
          if cargo nextest run --no-capture -E 'test(/store/)' 2>&1 | grep -q 'skipping'; then
            echo "store tests skipped: no database was reachable"
            exit 1
          fi

      # Reads deny.toml, which is also what the pre-push gate enforces, so a
      # advisory that appears upstream is caught here rather than at push time.
      - name: Dependency audit
        run: cargo deny check
