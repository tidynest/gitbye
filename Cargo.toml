[package]
name = "gitbye"
version = "0.8.3"
edition = "2024"
rust-version = "1.97"
description = "Notices the accounts that follow you, collect the follow-back, then quietly leave, and takes your follow back"
repository = "https://github.com/tidynest/gitbye"
readme = "README.md"
keywords = ["github", "followers", "unfollow", "egui", "postgresql"]
categories = ["command-line-utilities", "gui"]
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.100"
eframe = "0.32.3"
postgres = "0.19.14"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
# Already in the tree as a dependency of the library. The integration tests need
# it directly so they can create and drop a scratch database of their own, since
# a test must never be pointed at the real keep-list.
postgres = "0.19.14"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Module paths such as `model::User` read better than the flattened alternatives
# pedantic would push us towards.
module_name_repetitions = "allow"
# Suggests Duration::from_weeks and from_days, both of which are still
# nightly-only, so the lint has no fix available on stable.
duration_suboptimal_units = "allow"

[profile.release]
strip = true
lto = "thin"
