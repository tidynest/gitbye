<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="GitBye">
  <title>GitBye</title>
  <!-- The magpie of the fable.
       Black on gold rather than on the application's own charcoal, because a
       launcher icon is judged at sixteen pixels against an unknown background,
       and a dark bird on a dark ground disappears there. Gold is the one colour
       the interface already uses for something worth noticing.
       No feather in the beak: it was tried, and below about thirty-two pixels it
       degrades into a pale smudge beside the bird. The story is told in the
       README. An icon only has to be recognised. -->

  <rect width="64" height="64" rx="14" fill="#F0B357"/>

  <!-- Small head, sleek body, and a long graduated tail. Those three
       proportions are what separate a magpie from a generic bird once every
       other detail has been shrunk away. -->
  <path d="M24 15
           C30 15 34 19 34.5 24
           C38 26 41 30 42 34
           C48 39 54 46 58 53
           C56.5 55.5 54.5 57 52 57.5
           C47.5 50 42 44 36.5 39.5
           C33 43 27 43.5 22.5 41
           C16 37.5 14.5 27 18.5 20.5
           C20 16.5 21.5 15 24 15 Z"
        fill="#141018"/>

  <path d="M17.5 22.5 L6 25.5 L17.5 28.5 Z" fill="#141018"/>

  <!-- The eye is knocked out of the silhouette in the ground colour, so it costs
       no extra shape and still gives the face a point of focus. -->
  <circle cx="22.5" cy="21.5" r="2.1" fill="#F0B357"/>

  <!-- The pied flank. A magpie is the bird with the white patch, so this is the
       one marking worth keeping when all the rest is silhouette. -->
  <path d="M25 30.5 C29.5 28.5 34 30 36 34 C32.5 37.5 27.5 37.5 24 35 Z" fill="#FFF7E8"/>
</svg>
