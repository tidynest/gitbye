<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="GitBye">
  <title>GitBye</title>
  <!-- The two outcomes the application offers, side by side: a golden heart for
       the follow you keep, and a skull over crossed bones for the one you end. -->

  <rect width="64" height="64" rx="14" fill="#1C1A24"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#37324A" stroke-width="1.5"/>

  <!-- Kept -->
  <path d="M19 42.6C19 42.6 8.6 34.8 8.6 26.9C8.6 22.9 11.6 20 15.2 20C17.2 20 19 21.1 19 22.9C19 21.1 20.8 20 22.8 20C26.4 20 29.4 22.9 29.4 26.9C29.4 34.8 19 42.6 19 42.6Z"
        fill="#F0B357"/>

  <!-- Ended. The bones sit behind the skull in a dimmer bone colour, so the
       skull stays legible when the icon is drawn at menu size. -->
  <g stroke="#8F87A6" stroke-width="4" stroke-linecap="round">
    <line x1="33.2" y1="20.8" x2="55.8" y2="43.4"/>
    <line x1="55.8" y1="20.8" x2="33.2" y2="43.4"/>
  </g>
  <g fill="#8F87A6">
    <circle cx="33.2" cy="20.8" r="2.7"/>
    <circle cx="55.8" cy="20.8" r="2.7"/>
    <circle cx="33.2" cy="43.4" r="2.7"/>
    <circle cx="55.8" cy="43.4" r="2.7"/>
  </g>

  <path d="M44.5 21.6C39.7 21.6 36.2 24.9 36.2 29.5C36.2 32.1 37.3 34.1 39 35.4V37.9C39 38.9 39.8 39.7 40.8 39.7H48.2C49.2 39.7 50 38.9 50 37.9V35.4C51.7 34.1 52.8 32.1 52.8 29.5C52.8 24.9 49.3 21.6 44.5 21.6Z"
        fill="#EDE9F5" stroke="#1C1A24" stroke-width="1.7" stroke-linejoin="round"/>
  <circle cx="41.4" cy="29.6" r="2.7" fill="#1C1A24"/>
  <circle cx="47.6" cy="29.6" r="2.7" fill="#1C1A24"/>
  <path d="M44.5 32.7L45.9 35.4H43.1Z" fill="#1C1A24"/>
</svg>
