[package]
name = "gitbye"
version = "0.5.6"
edition = "2024"
rust-version = "1.97"
description = "Compare GitHub followers against following, and unfollow the accounts that never reciprocated"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.100"
eframe = "0.32.3"
postgres = "0.19.14"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Module paths such as `model::User` read better than the flattened alternatives
# pedantic would push us towards.
module_name_repetitions = "allow"
# Suggests Duration::from_weeks and from_days, both of which are still
# nightly-only, so the lint has no fix available on stable.
duration_suboptimal_units = "allow"

[profile.release]
strip = true
lto = "thin"
